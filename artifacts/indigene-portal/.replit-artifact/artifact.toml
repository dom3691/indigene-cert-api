kind = "web"
previewPath = "/"
title = "Indigene Certificate Portal"
version = "1.0.0"
id = "artifacts/indigene-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23101

[services.development]
run = "pnpm --filter @workspace/indigene-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/indigene-portal", "run", "build" ]
publicDir = "artifacts/indigene-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23101"
BASE_PATH = "/"
